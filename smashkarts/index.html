	if (isMobile()) { mainContainer.className = "unity-mobile"; }
	else { rotateLandscape.id = "rotateLandscapeOff"; rotateLandscape.style.display = "none"; }
	document.querySelector("#loader .progress").style.display = "block";
	progressBarFull.style.width = "0%";
	var gameInstance;
	var script = document.createElement("script");
	script.src = loaderUrl;
	script.onload = () => {
		createUnityInstance(canvas, config, (p) => { progressBarFull.style.width = (100 * p) + "%"; })
		.then((unityInstance) => {
			loadingBar.style.display = "none";
			window.unityGame = unityInstance;
			gameInstance = unityInstance;
			try{setV(Date.now() - timerStart);}catch(e){}
			window.unityGame.SendMessage(unityFirebaseGameOjbectName, "SetDisplayAdProvider", displayAdProvider);
			window.unityGame.SendMessage(unityFirebaseGameOjbectName, "SetVideoAdProvider", videoAdProvider);
			try{trySendAdBlockDetectedMessage();}catch(e){}
		}).catch((message) => { console.error(message); });
	};
	document.body.appendChild(script);
