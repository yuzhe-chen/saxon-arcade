<!DOCTYPE html>
<html>
  <head>
<script src="../bridge.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, minimal-ui" />
    <title>Subway Surfers</title>
    <style>
      body { background-color: #000; margin: 0; overflow: hidden; -webkit-tap-highlight-color: rgba(0,0,0,0); }
      .fontcache { position: fixed; margin-left: -100px; }
      #og-game-holder { position: fixed; overflow: hidden; width: 100%; height: 100vh; background-position: center; background-repeat: no-repeat; margin: 0; }
    </style>
    <script type="bridge/defer" src="pokistub.js"></script>
    <!-- main.js logs screens to these (they came from the removed ad adapter); without them the title screen never opens -->
    <script type="bridge/defer">window.dataLayer=window.dataLayer||[];window.productTitle='Subway Surfers';</script>
  </head>
  <body>
    <div id="og-game-holder"></div>
    <script src="../bookrun.js"></script>
    <script>
    /* Subway Surfers takes 20 to 40 seconds to load: after 5 seconds the Book Run minigame opens over its loader.
       The game logs its title screen through dataLayer.push, which is when loading is over. */
    (function(){
      var done=false;
      var dl=window.dataLayer=window.dataLayer||[],push=dl.push;
      dl.push=function(){if(!done){done=true;if(window.BookRun)BookRun.loaded();}return push.apply(dl,arguments);};
      setTimeout(function(){if(!done&&window.BookRun)BookRun.open({mode:'loading',label:'Subway Surfers',expect:25,
        note:'Subway Surfers usually takes 20 to 40 seconds to load.',onClose:function(){try{window.focus();}catch(e){}}});},5000);
    })();
    </script>
    <script type="bridge/defer" src="js/boot.js"></script>
  </body>
</html>
