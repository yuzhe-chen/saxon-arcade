<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doom</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}.dosbox-container{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{outline:0;user-select:none;-webkit-user-select:none;width:min(100vw,133.33vh)!important;height:min(75vw,100vh)!important;image-rendering:pixelated}</style>
<script src="js-dos.js"></script></head><body>
<canvas id="jsdos" tabindex="0"></canvas>
<script>
var base=document.baseURI;
Dos(document.getElementById('jsdos'),{wdosboxUrl:new URL('wdosbox.js',base).href,cycles:'max',autolock:false}).ready(function(fs,main){
  fs.extract(new URL('doom.zip',base).href).then(function(){
    main(['-c','DOOM.EXE']).then(function(ci){window.ci=ci;window.Module=ci.dos;document.getElementById('jsdos').focus();});
  });
});
</script></body></html>
